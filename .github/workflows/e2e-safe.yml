name: Safe browser smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "15 16 * * 3"

permissions:
  contents: read

concurrency:
  group: safe-browser-smoke
  cancel-in-progress: true

jobs:
  browser-smoke:
    name: Read-only desktop and mobile journeys
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      PLAYWRIGHT_DISABLE_LLM: "1"
      PLAYWRIGHT_WEB_SERVER_COMMAND: "npm start -- -p 4000"
      PAYOS_CLIENT_ID: ""
      PAYOS_API_KEY: ""
      PAYOS_CHECKSUM_KEY: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production app
        run: npm run build

      - name: Run safe browser smoke
        run: npx playwright test tests/e2e/ci-safe.spec.ts tests/e2e/production-security.spec.ts

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safe-browser-smoke-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
